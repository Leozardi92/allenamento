function esc(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

// --- Decodifica polyline Google (usata da Strava) — algoritmo standard, nessuna libreria esterna ---
function decodePolyline(str) {
  var index = 0, lat = 0, lng = 0, coordinates = [];
  while (index < str.length) {
    var b, shift = 0, result = 0;
    do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
    lat += (result & 1) ? ~(result >> 1) : (result >> 1);
    shift = 0; result = 0;
    do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
    lng += (result & 1) ? ~(result >> 1) : (result >> 1);
    coordinates.push([lat / 1e5, lng / 1e5]);
  }
  return coordinates;
}

function semaforo(w) {
  if (!w) return { bg: "#1c1004", col: "#fbbf24", text: "⚠️ Nessun dato Garmin recente disponibile" };
  var r = 0, y = 0;
  if (w.rhr > 62) r++; else if (w.rhr > 57) y++;
  if (w.bb < 40) r++; else if (w.bb < 60) y++;
  if (w.stress > 50) y++;
  if (w.tr < 40) r++; else if (w.tr < 60) y++;
  if (r >= 2) return { bg: "#1c0808", col: "#f87171", text: "🔴 Segnali di affaticamento — riposo o attività molto leggera oggi" };
  if (r === 1 || y >= 2) return { bg: "#1c1004", col: C.p6, text: "⚠️ Recupero non completo — alleggerisci la sessione del 20–30%" };
  return { bg: "#052e16", col: C.p1, text: "✅ Garmin nella norma — procedi con la sessione pianificata" };
}

// --- SVG line chart: km cumulati giorno per giorno nel blocco corrente,
// con una linea tratteggiata orizzontale per il target pianificato del blocco ---
function blockKmLineSVG(series, targetTotal) {
  var w = 420, h = 150, padL = 28, padR = 8, padT = 12, padB = 22;
  var maxVal = Math.max(targetTotal || 0, series.length ? series[series.length - 1].cumulative_km : 0, 10) * 1.1;
  function x(i) { return series.length > 1 ? padL + i * (w - padL - padR) / (series.length - 1) : padL; }
  function y(v) { return padT + (h - padT - padB) * (1 - v / maxVal); }

  var pathParts = series.map(function(d, i) {
    return (i ? "L" : "M") + x(i).toFixed(1) + "," + y(d.cumulative_km).toFixed(1);
  });
  var lastPt = series.length ? [x(series.length - 1), y(series[series.length - 1].cumulative_km)] : null;

  var targetLine = "";
  if (targetTotal) {
    var ty = y(targetTotal).toFixed(1);
    targetLine =
      '<line x1="' + padL + '" y1="' + ty + '" x2="' + (w - padR) + '" y2="' + ty +
        '" stroke="' + C.muted + '" stroke-width="1.5" stroke-dasharray="3,3" />' +
      '<text x="' + (w - padR) + '" y="' + (parseFloat(ty) - 4) + '" font-size="9" fill="' + C.muted +
        '" text-anchor="end">target ' + targetTotal + ' km</text>';
  }

  var labelStep = Math.max(1, Math.ceil(series.length / 6));
  var xLabels = series.map(function(d, i) {
    if (i % labelStep !== 0 && i !== series.length - 1) return "";
    return '<text x="' + x(i).toFixed(1) + '" y="' + (h - 6) + '" font-size="8" fill="' + C.muted +
      '" text-anchor="middle">' + esc(d.date) + '</text>';
  }).join("");

  return (
    '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;height:auto;display:block">' +
      targetLine +
      '<path d="' + pathParts.join(" ") + '" fill="none" stroke="' + C.p2 + '" stroke-width="1.8" />' +
      (lastPt ? '<circle cx="' + lastPt[0].toFixed(1) + '" cy="' + lastPt[1].toFixed(1) + '" r="3" fill="' + C.p6 + '" />' : "") +
      xLabels +
    '</svg>'
  );
}

function zoneBarHTML(seconds) {
  var total = seconds.reduce(function(a,b){return a+b;}, 0) || 1;
  var bar = seconds.map(function(s, i) {
    var pct = (s / total * 100);
    if (pct < 1) return "";
    return '<div style="width:' + pct.toFixed(1) + '%;background:' + ZONE_COLORS[i] + '">' +
      (pct > 8 ? ZONE_NAMES[i] : "") + '</div>';
  }).join("");
  var legend = seconds.map(function(s, i) {
    var min = Math.round(s / 60);
    return '<span><i style="background:' + ZONE_COLORS[i] + '"></i>' + ZONE_NAMES[i] + ' ' + min + ' min</span>';
  }).join("");
  return '<div class="zone-bar">' + bar + '</div><div class="zone-legend">' + legend + '</div>';
}

function fmtDuration(sec) {
  var h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60);
  return h > 0 ? (h + "h " + m + "min") : (m + " min");
}
function fmtPace(distM, movingS) {
  if (!distM) return "N/A";
  var secPerKm = movingS / (distM / 1000);
  var m = Math.floor(secPerKm / 60), s = Math.round(secPerKm % 60);
  return m + ":" + (s < 10 ? "0" : "") + s + "/km";
}

function fmtPaceFromSec(secPerKm) {
  if (!secPerKm) return "N/A";
  var m = Math.floor(secPerKm / 60), s = Math.round(secPerKm % 60);
  return m + ":" + (s < 10 ? "0" : "") + s + "/km";
}

// Fasce cardiache di riferimento (Z1-Z5), calcolate lato Python da AeT/AnT/
// FCmax in contesto-allenamento.md — 5 segmenti a LARGHEZZA UGUALE (non
// proporzionale ai bpm: Z3 può essere larga solo 3 bpm, con una barra
// proporzionale i numeri si accavallano e diventa illeggibile). Ogni
// segmento porta il proprio nome + range, quindi resta leggibile a
// prescindere da quanto è fisiologicamente stretta quella zona.
function fasceCardiacheSVG(zones) {
  var names = ["Z1", "Z2", "Z3", "Z4", "Z5+"];
  var colors = ["#6b7280", "#4ade80", "#fbbf24", "#f97316", "#f43f5e"];
  var displayFloor = 100; // solo per l'etichetta di Z1 — la classificazione dati reale resta invariata

  var segs = zones.map(function(z, i) {
    var lo = (i === 0) ? Math.max(z.min, displayFloor) : z.min;
    var rangeLabel = (i === zones.length - 1) ? (lo + "+") : (lo + "–" + z.max);
    return (
      '<div style="flex:1;background:' + colors[i] + ';padding:10px 4px;text-align:center;' +
        (i > 0 ? 'border-left:2px solid var(--bg);' : '') + '">' +
        '<div style="font-size:12px;font-weight:900;color:#0009">' + names[i] + '</div>' +
        '<div style="font-size:11px;font-weight:700;color:#0008;margin-top:2px;white-space:nowrap">' + rangeLabel + '</div>' +
      '</div>'
    );
  }).join("");

  return '<div style="display:flex;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.3)">' + segs + '</div>';
}

// TAB PANORAMICA — heatmap 40 settimane + grafico impilato

// Km pianificati per settimana (S1..S40) — stessa fonte di generate_dashboard.py
var PLANNED_KM = [
  14,14,14,16,31,34,20,36,38,41,20,44,47,49,23,49,20,50,51,24,
  52,56,57,26,59,44,12,33,57,62,28,66,66,20,12,38,39,30,21,8
];

function mondayOnOrBefore(d) {
  var day = d.getDay(); // 0=Dom..6=Sab
  var diff = (day === 0) ? 6 : day - 1;
  var m = new Date(d.getFullYear(), d.getMonth(), d.getDate() - diff);
  return m;
}
var PLAN_WEEK1_MONDAY = mondayOnOrBefore(new Date(2026, 8, 1)); // 1 settembre 2026

function weekIndexForDate(d) {
  var days = Math.floor((mondayOnOrBefore(d) - PLAN_WEEK1_MONDAY) / 86400000);
  return Math.floor(days / 7);
}
function currentWeekNumber() {
  return weekIndexForDate(new Date()) + 1;
}

function dateForWeekDay(weekNum, dayIdx) {
  var weekMonday = new Date(PLAN_WEEK1_MONDAY.getTime() + (weekNum - 1) * 7 * 86400000);
  var d = new Date(weekMonday.getTime() + dayIdx * 86400000);
  var mm = String(d.getMonth() + 1).padStart(2, "0");
  var dd = String(d.getDate()).padStart(2, "0");
  return d.getFullYear() + "-" + mm + "-" + dd;
}

function computeWeekMetrics(week) {
  var phase = PHASES.filter(function(p){ return p.id === week.p; })[0];
  var easy = 0, quality = 0, trailKmTotal = 0, trailKmMax = 0, runKm = 0, bikeMin = 0;
  var gymDays = [], skimo = false, testType = null, raceName = null;

  week.days.forEach(function(d) {
    var label = d.l || "";
    if (d.t === "run") {
      var mk = /([\d.]+)\s*km/.exec(label);
      var km = mk ? parseFloat(mk[1]) : 0;
      runKm += km;
      if (/qualit|progressivo/i.test(label)) quality++; else easy++;
    } else if (d.t === "bike") {
      easy++;
      var mb = /(\d+)\s*min/.exec(label);
      if (mb) bikeMin += parseInt(mb[1], 10);
    } else if (d.t === "trail") {
      // Alcune settimane hanno due uscite trail (long + back-to-back il
      // giorno dopo): "Trail lungo" nell'heatmap deve mostrare la singola
      // uscita più lunga, non la somma delle due (altrimenti un 37+13
      // diventa un fantomatico "50 km" che in realtà non esiste come sessione).
      var mt = /([\d.]+)\s*km/.exec(label);
      if (mt) {
        var km2 = parseFloat(mt[1]);
        trailKmTotal += km2;
        trailKmMax = Math.max(trailKmMax, km2);
      }
    } else if (d.t === "gym") {
      var mg = /Giorno\s*(\d)/.exec(label);
      if (mg) gymDays.push(mg[1]);
    } else if (d.t === "skimo") {
      skimo = true;
    } else if (d.t === "test") {
      testType = /AnT/i.test(label) ? "AnT" : "AeT";
    } else if (d.t === "race") {
      raceName = label.replace(/[^\w\sÀ-ÿ]/g, "").trim();
    }
  });

  return {
    phase: phase, plannedKm: PLANNED_KM[week.w - 1],
    easy: easy, quality: quality,
    trailKmMax: trailKmMax, trailKmTotal: trailKmTotal,
    runKm: runKm, bikeMin: bikeMin,
    bikeEquivKm: bikeMin / 3, gymDays: gymDays, skimo: skimo, testType: testType, raceName: raceName,
  };
}

function heatmapCell(key, m, weekNum, maxTrail, maxBike, isCur) {
  var curClass = isCur ? " hm-current" : "";
  if (key === "phase") {
    return '<td class="hm-cell' + curClass + '" style="background:' + m.phase.col + '33;color:' + m.phase.col + ';font-weight:700">' + esc(m.phase.name.slice(0, 3)) + '</td>';
  }
  if (key === "volume") {
    var opV = Math.max(0.12, m.plannedKm / 66);
    return '<td class="hm-cell' + curClass + '" style="background:rgba(96,165,250,' + opV.toFixed(2) + ')">' + m.plannedKm + '</td>';
  }
  if (key === "easy") {
    var opE = m.easy ? Math.min(1, 0.2 + m.easy * 0.18) : 0;
    return '<td class="hm-cell' + curClass + '" style="background:rgba(74,222,128,' + opE.toFixed(2) + ')">' + (m.easy || "") + '</td>';
  }
  if (key === "quality") {
    var opQ = m.quality ? Math.min(1, 0.25 + m.quality * 0.25) : 0;
    return '<td class="hm-cell' + curClass + '" style="background:rgba(249,115,22,' + opQ.toFixed(2) + ')">' + (m.quality || "") + '</td>';
  }
  if (key === "trail") {
    var opT = m.trailKmMax ? Math.max(0.15, m.trailKmMax / maxTrail) : 0;
    return '<td class="hm-cell' + curClass + '" style="background:rgba(74,222,128,' + opT.toFixed(2) + ')">' + (m.trailKmMax || "") + '</td>';
  }
  if (key === "bike") {
    var opB = m.bikeMin ? Math.max(0.15, m.bikeMin / maxBike) : 0;
    return '<td class="hm-cell' + curClass + '" style="background:rgba(249,115,22,' + opB.toFixed(2) + ')">' + (m.bikeMin || "") + '</td>';
  }
  if (key === "gym") {
    var gymLabel = m.gymDays.length ? m.gymDays.map(function(g){ return "G" + g; }).join("+") : "";
    return '<td class="hm-cell' + curClass + '" style="color:#a78bfa;font-weight:700;font-size:' + (m.gymDays.length > 1 ? "7px" : "9px") + '">' + gymLabel + '</td>';
  }
  if (key === "skimo") {
    return '<td class="hm-cell' + curClass + '" style="color:#bae6fd">' + (m.skimo ? "✓" : "") + '</td>';
  }
  if (key === "test") {
    return '<td class="hm-cell' + curClass + '" style="color:#f43f5e;font-weight:700">' + (m.testType || "") + '</td>';
  }
  if (key === "race") {
    return '<td class="hm-cell' + curClass + '" style="color:#fbbf24;font-weight:700;font-size:8px">' + esc(m.raceName || "") + '</td>';
  }
  return '<td class="hm-cell' + curClass + '"></td>';
}

function renderHeatmap(metrics) {
  var rows = [
    ["phase", "Fase"], ["volume", "Volume km"], ["easy", "Easy Z2"], ["quality", "Qualità"],
    ["trail", "Trail lungo"], ["bike", "Bici (min)"], ["gym", "Palestra"],
    ["skimo", "Skimo"], ["test", "Test"], ["race", "Gara"],
  ];
  var maxTrail = Math.max.apply(null, metrics.map(function(m){ return m.trailKmMax; }).concat([1]));
  var maxBike = Math.max.apply(null, metrics.map(function(m){ return m.bikeMin; }).concat([1]));
  var curWeek = currentWeekNumber();

  var head = '<tr><th class="hm-label"></th>' + W.map(function(w) {
    return '<th class="' + (w.w === curWeek ? "hm-current" : "") + '">S' + w.w + '</th>';
  }).join("") + '</tr>';

  var body = rows.map(function(row) {
    var key = row[0], label = row[1];
    var cells = W.map(function(w, i) {
      return heatmapCell(key, metrics[i], w.w, maxTrail, maxBike, w.w === curWeek);
    }).join("");
    return '<tr><td class="hm-label">' + esc(label) + '</td>' + cells + '</tr>';
  }).join("");

  return '<div class="heatmap-scroll"><table class="heatmap"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>';
}

function stackedChartSVG(metrics) {
  var w = 900, h = 190, padL = 6, padR = 6, padT = 10, padB = 32;
  var totals = metrics.map(function(m) { return m.trailKmTotal + m.runKm + m.bikeEquivKm + (m.skimo ? 5 : 0); });
  var actualSeries = DATA.weekly_actual_km || [];
  var maxVal = Math.max.apply(null, totals.concat(actualSeries).concat([10]));
  var n = metrics.length;
  var groupW = (w - padL - padR) / n;
  var barW = groupW * 0.7;
  var curWeek = currentWeekNumber();

  function yOf(v) { return padT + (h - padT - padB) * (1 - v / maxVal); }

  var bars = "", markers = "", linePts = [];
  metrics.forEach(function(m, i) {
    var x = padL + i * groupW + (groupW - barW) / 2;
    var curY = h - padB;
    var segs = [
      { v: m.trailKmTotal, color: "#166534" },
      { v: m.runKm, color: "#60a5fa" },
      { v: m.bikeEquivKm, color: "#f97316" },
      { v: m.skimo ? 5 : 0, color: "#f0ede8" },
    ];
    segs.forEach(function(s) {
      if (s.v <= 0) return;
      var segH = (h - padT - padB) * (s.v / maxVal);
      curY -= segH;
      bars += '<rect x="' + x.toFixed(1) + '" y="' + curY.toFixed(1) + '" width="' + barW.toFixed(1) + '" height="' + segH.toFixed(1) + '" fill="' + s.color + '" />';
    });

    if (W[i].w === curWeek) {
      var totH = (h - padT - padB) * (totals[i] / maxVal);
      bars += '<rect x="' + (x - 1).toFixed(1) + '" y="' + (h - padB - totH - 1).toFixed(1) + '" width="' + (barW + 2).toFixed(1) + '" height="' + (totH + 2).toFixed(1) + '" fill="none" stroke="#fbbf24" stroke-width="1.2" />';
    }

    var midX = x + barW / 2;
    var mark = "";
    if (m.testType) mark = "🔬";
    else if (m.raceName) mark = "🏁";
    else if (/scarico/i.test(W[i].note || "")) mark = "⚡";
    if (mark) markers += '<text x="' + midX.toFixed(1) + '" y="' + (h - padB + 14) + '" font-size="8" text-anchor="middle">' + mark + '</text>';

    linePts.push([midX, yOf(actualSeries[i] || 0)]);
  });

  var linePath = linePts.map(function(p, i) { return (i ? "L" : "M") + p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ");

  return (
    '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;height:auto;display:block">' +
      bars +
      '<path d="' + linePath + '" fill="none" stroke="#fbbf24" stroke-width="1.3" opacity="0.85" />' +
      markers +
    '</svg>'
  );
}

// Timeline orizzontale set 2026 -> giu 2027, marker solo per test/gare/scarichi
function timelineMilestonesSVG() {
  var planStart = PLAN_WEEK1_MONDAY;
  var planEnd = new Date(planStart.getTime() + 39 * 7 * 86400000 + 6 * 86400000);
  var totalMs = planEnd - planStart;

  var markers = [];
  W.forEach(function(week) {
    var wStart = new Date(planStart.getTime() + (week.w - 1) * 7 * 86400000);
    var frac = (wStart - planStart) / totalMs;
    var hasTest = week.days.some(function(d){ return d.t === "test"; });
    var raceDay = week.days.filter(function(d){ return d.t === "race"; })[0];
    var isScarico = /scarico/i.test(week.note || "");
    if (hasTest) {
      var testLabel = week.days.filter(function(d){ return d.t === "test"; })[0].l.replace(/[^\w\sÀ-ÿ]/g, "").trim();
      markers.push({ frac: frac, icon: "🔬", label: testLabel, date: wStart });
    }
    if (raceDay) {
      markers.push({ frac: frac, icon: "🏁", label: raceDay.l.replace(/[^\w\sÀ-ÿ]/g, "").trim(), date: wStart });
    } else if (isScarico) {
      markers.push({ frac: frac, icon: "⚡", label: "Scarico", date: wStart });
    }
  });

  var w = Math.max(500, markers.length * 90), h = 90, padL = 16, padR = 16, midY = 30;
  var line = '<line x1="' + padL + '" y1="' + midY + '" x2="' + (w - padR) + '" y2="' + midY + '" stroke="var(--border)" stroke-width="2" />';
  var items = markers.map(function(m) {
    var x = padL + m.frac * (w - padL - padR);
    var dateLabel = m.date.toLocaleDateString("it-IT", { day: "2-digit", month: "short" });
    return (
      '<g>' +
        '<circle cx="' + x.toFixed(1) + '" cy="' + midY + '" r="4" fill="var(--card)" stroke="var(--p6)" stroke-width="1.5" />' +
        '<text x="' + x.toFixed(1) + '" y="' + (midY - 12) + '" font-size="13" text-anchor="middle">' + m.icon + '</text>' +
        '<text x="' + x.toFixed(1) + '" y="' + (midY + 20) + '" font-size="8" fill="var(--text)" text-anchor="middle" font-weight="700">' + esc(m.label.slice(0, 14)) + '</text>' +
        '<text x="' + x.toFixed(1) + '" y="' + (midY + 32) + '" font-size="7" fill="var(--muted)" text-anchor="middle">' + esc(dateLabel) + '</text>' +
      '</g>'
    );
  }).join("");

  return (
    '<div style="overflow-x:auto;-webkit-overflow-scrolling:touch">' +
      '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:' + w + 'px;height:' + h + 'px;display:block">' +
        line + items +
      '</svg>' +
    '</div>'
  );
}

function daysTo(dateStr) {
  return Math.max(0, Math.ceil((new Date(dateStr) - new Date()) / 86400000));
}
function currentPhase() {
  var n = new Date();
  if (n < new Date("2026-09-01")) return "Pre";
  if (n < new Date("2026-10-01")) return "Restart";
  if (n < new Date("2026-12-01")) return "Base";
  if (n < new Date("2027-02-01")) return "Aerobico";
  if (n < new Date("2027-04-01")) return "Specifico";
  if (n < new Date("2027-06-01")) return "Picco";

function renderWeekCard(week) {
  var isOpen = planState.openWeek === week.w;
  var hasRace = week.days.some(function(d){ return d.t === "race"; });
  var hasTest = week.days.some(function(d){ return d.t === "test"; });
  var badge = "";
  if (hasRace) badge = '<span class="week-badge" style="background:#1c1004;color:#fbbf24">🏁</span>';
  else if (hasTest) badge = '<span class="week-badge" style="background:#1c0808;color:#fca5a5">🔬</span>';
  else if (week.sp) badge = '<span class="week-badge" style="background:#1e0a3c;color:#c4b5fd">' + esc(week.sp) + '</span>';

  var doneCount = 0, plannedCount = 0;
  week.days.forEach(function(d, i) {
    if (d.t === "rest") return;
    plannedCount++;
    if (DATA.completed_dates.indexOf(dateForWeekDay(week.w, i)) !== -1) doneCount++;
  });
  var doneColor = plannedCount && doneCount === plannedCount ? C.p1 : "var(--muted)";
  var doneCounter = '<span class="week-done-count" style="color:' + doneColor + '">' + doneCount + '/' + plannedCount + ' fatti</span>';

  var body = "";
  if (isOpen) {
    var note = week.note ? '<div class="week-note">' + esc(week.note) + '</div>' : "";
    var days = week.days.map(function(d, i) { return renderDayRow(d, DAYS[i], dateForWeekDay(week.w, i)); }).join("");
    body = '<div class="week-body">' + note + '<div class="week-days">' + days + '</div></div>';
  }

  return (
    '<div class="week-card">' +
      '<button class="week-head" data-week="' + week.w + '">' +
        '<div>' +
          '<div class="week-title-row"><span class="week-title">Settimana ' + week.w + '</span>' + badge + '</div>' +
          '<div class="week-dates">' + esc(week.d) + ' · ' + doneCounter + '</div>' +
        '</div>' +
        '<span class="week-chevron">' + (isOpen ? "▲" : "▼") + '</span>' +
      '</button>' + body +
    '</div>'
  );
}

var UTMB_STONES_TARGET = 20;
var UTMB_STONES_CURRENT = 0;
var UTMB_CURRENT_YEAR = 2026;

var UTMB_ROADMAP = [
  {year: 2026, race: "—", gained: "0", total: 0, index: "50K (scade ago 2027)", note: "Anno di base"},
  {year: 2027, race: "Lavaredo 80K", gained: "+3", total: 3, index: "100K (valido 2029)", note: "Prima WS race"},
  {year: 2028, race: "2 gare WS 100K", gained: "+6", total: 9, index: "100K refresh", note: "Accumulo serio"},
  {year: 2029, race: "Lavaredo 120K + 1 WS 100K", gained: "+4+3", total: 16, index: "100M (valido 2031)", note: "Index 100M sbloccato"},
  {year: 2030, race: "1 gara WS 100M o 100K", gained: "+4", total: 20, index: "100M refresh", note: "Lotteria con 20 stones"},
  {year: 2031, race: "UTMB", gained: "—", total: 20, index: "100M valido", note: "~65-75% estrazione"},
];

var UTMB_PROB_TABLE = [
  {min: 1, max: 3, label: "1-3", prob: "~5-8%"},
  {min: 4, max: 7, label: "4-7", prob: "~10-15%"},
  {min: 8, max: 12, label: "8-12", prob: "~20-30%"},
  {min: 13, max: 17, label: "13-17", prob: "~35-50%"},
  {min: 18, max: 22, label: "18-22", prob: "~60-75%"},
  {min: 23, max: Infinity, label: "23+", prob: "~80%+"},
];

function utmbProbabilityFor(stones) {
  if (stones < 1) return null; // serve almeno 1 stone negli ultimi 24 mesi
  for (var i = 0; i < UTMB_PROB_TABLE.length; i++) {
    if (stones >= UTMB_PROB_TABLE[i].min && stones <= UTMB_PROB_TABLE[i].max) return UTMB_PROB_TABLE[i];
  }
  return null;
}

function renderUtmb() {
  var pct = Math.round((UTMB_STONES_CURRENT / UTMB_STONES_TARGET) * 100);
  var prob = utmbProbabilityFor(UTMB_STONES_CURRENT);

  var years = UTMB_ROADMAP.map(function(r) {
    var isCurrent = r.year === UTMB_CURRENT_YEAR;
    return (
      '<div class="utmb-year-row' + (isCurrent ? " current" : "") + '">' +
        '<div class="utmb-year-dot">' + r.year + '</div>' +
        '<div>' +
          '<div class="utmb-year-race">' + esc(r.race) + '</div>' +

          '<div class="utmb-year-stones">' + esc(r.gained) + ' stones → totale ' + r.total + '</div>' +
        '</div>' +
      '</div>'
    );
  }).join("");

  // barra probabilità: posiziona un marcatore sulla fascia corrente del target 20
  var probBarSegs = UTMB_PROB_TABLE.map(function(band, i) {
    var isTargetBand = UTMB_STONES_TARGET >= band.min && UTMB_STONES_TARGET <= band.max;
    return (
      '<div style="flex:1;background:' + (isTargetBand ? C.p1 : "#242424") + ';padding:8px 2px;text-align:center;' +
        (i > 0 ? "border-left:2px solid var(--bg);" : "") + '">' +
        '<div style="font-size:10px;font-weight:800;color:' + (isTargetBand ? "#0009" : "var(--muted)") + '">' + band.label + '</div>' +
        '<div style="font-size:9px;font-weight:700;color:' + (isTargetBand ? "#0008" : "var(--muted)") + '">' + band.prob + '</div>' +
      '</div>'
    );
  }).join("");

  document.getElementById("page-utmb").innerHTML =
    '<div class="card"><div class="card-body">' +
      '<div class="param-l" style="margin-bottom:2px">RUNNING STONES</div>' +
      '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +

      '<div class="note" style="padding:8px 0 0">Stones per gara WS completata: 20K=1 · 50K=2 · 100K=3 · 100M=4. Non scadono mai.</div>' +
    '</div></div>' +

      '<div class="note" style="padding:6px 0 0">Prossimo refresh con Lavaredo 80K (giu 2027) → sblocca categoria 100K.</div>' +
    '</div></div>' +

    '<div class="card">' +
      '<div class="card-head"><span class="label">🎯 Probabilità di estrazione</span></div>' +
      '<div class="card-body" style="padding-top:12px">' +

        '<div class="note" style="padding:0">' + (prob
          ? "Con " + UTMB_STONES_CURRENT + " stones: " + prob.prob + " di probabilità di estrazione UTMB."
          : "Con " + UTMB_STONES_CURRENT + " stones non sei ancora idoneo alla lotteria — serve almeno 1 stone (una gara World Series completata) negli ultimi 24 mesi. La fascia evidenziata sopra (" + UTMB_STONES_TARGET + ") è il target roadmap.") +
        '</div>' +
      '</div>' +

    '<div class="card">' +
      '<div class="card-head"><span class="label">🗺️ Percorso 2026 → 2031</span></div>' +
      years +
    '</div>' +

function phaseEndDateLabel(phaseId) {
  var weeks = W.filter(function(w){ return w.p === phaseId; });

  return last ? last.d.split(/[–-]/).pop().trim() : "";
}

  var curWeek = currentWeekNumber();
  var cards = PHASES.map(function(ph) {
    var weeks = W.filter(function(w){ return w.p === ph.id; });
    var firstW = weeks[0].w, lastW = weeks[weeks.length - 1].w;
    var status, statusBg, statusCol;
    if (curWeek > lastW) { status = "Da generare"; statusBg = "#1c1004"; statusCol = C.p6; }
    else if (curWeek >= firstW && curWeek <= lastW) { status = "In corso"; statusBg = "#0a1628"; statusCol = C.p2; }
    else { status = "In attesa"; statusBg = "#1f2937"; statusCol = C.muted; }
    return (
      '<div class="verdict-card">' +
        '<div class="verdict-title-row">' +
          '<div>' +
            '<div class="verdict-title" style="color:' + ph.col + '">' + esc(ph.name) + '</div>' +
            '<div class="verdict-dates">Settimane ' + firstW + '–' + lastW + ' · fino al ' + esc(phaseEndDateLabel(ph.id)) + '</div>' +
          '</div>' +
          '<span class="verdict-status" style="background:' + statusBg + ';color:' + statusCol + '">' + status + '</span>' +
        '</div>' +
      '</div>'
    );
  }).join("");

  document.getElementById("page-verdict").innerHTML =
    '<div class="note" style="padding:0 0 12px">' +
      'Analisi automatica generata da Claude Code a fine di ogni blocco: disciplina nelle uscite easy ' +
      '(% tempo sopra AeT), separazione qualità/easy, progressione del volume, andamento FC a riposo. ' +
      'Basata sulle metriche descritte in contesto-allenamento.md — nessun documento di riferimento ' +
      'esterno collegato al momento. Non c&apos;è ancora nessun blocco completato: il primo verdetto ' +
      'reale arriva dopo la fine del blocco Restart (fine settembre 2026).' +
    '</div>' +
    cards;
}

function initTabs() {
  var btns = document.querySelectorAll(".tab-btn");
  btns.forEach(function(btn) {
    btn.addEventListener("click", function() {
      btns.forEach(function(b){ b.classList.remove("active"); });
      btn.classList.add("active");
      document.querySelectorAll(".page").forEach(function(p){ p.classList.remove("active"); });
      document.getElementById("page-" + btn.dataset.page).classList.add("active");
    });
  });
}

document.addEventListener("DOMContentLoaded", function() {
  renderOggi();
  renderForma();
  renderPiano();
  renderBlocchi();
  renderUtmb();
  renderVerdict();
  initTabs();
});
</script>
</body>
</html>
