<style>
  :root {
    --bg:#0f0f0f; --card:#1a1a1a; --card2:#242424; --border:#2e2e2e;
    --text:#f0ede8; --muted:#6b6560;
    --p1:#4ade80; --p2:#60a5fa; --p3:#f97316; --p4:#a78bfa; --p5:#f43f5e; --p6:#fbbf24;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; color: var(--text); }
  #root { min-height: 100vh; max-width: 480px; margin: 0 auto; padding-bottom: 60px; }

  /* Desktop/tablet: la dashboard resta pensata mobile-first (colonna stretta,
     un'informazione alla volta) ma su schermi larghi allargarla evita la
     striscia centrale con enormi bordi vuoti a destra/sinistra. Nessun
     ridisegno del layout — solo più respiro orizzontale e testo leggermente
     più leggibile da seduti a un metro dallo schermo invece che in mano. */
  @media (min-width: 700px) {
    body { background: #050505; }
    #root {
      max-width: 640px;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }
    .stat-v, .param-v { font-size: 1.08em; }
  }
  @media (min-width: 1100px) {
    #root { max-width: 760px; }
  }

  .header { background: linear-gradient(160deg,#1a1a2e 0%,#0f0f1a 100%); padding: 40px 20px 20px; border-bottom: 1px solid var(--border); }
  .eyebrow { font-size: 10px; letter-spacing: .15em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  h1 { font-size: 22px; font-weight: 900; letter-spacing: -0.5px; margin: 0; }
  .subline { font-size: 12px; color: var(--muted); margin-top: 6px; }

  .tabs { display: flex; gap: 4px; padding: 14px 12px 0; }
  .tab-btn { flex: 1; padding: 8px 0; border-radius: 10px; font-size: 10.5px; font-weight: 700; border: none; cursor: pointer; background: var(--card); color: var(--muted); }
  .tab-btn.active { background: var(--p2); color: #000; }
  .page { padding: 12px 16px 0; display: none; }
  .page.active { display: block; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; margin-bottom: 12px; }
  .card-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .card-head .label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
  .card-head .date { font-size: 11px; color: var(--p6); }
  .card-body { padding: 12px 14px; }

  .semaforo { margin: 0 0 12px; padding: 10px 14px; border-radius: 12px; font-size: 12px; font-weight: 600; border: 1px solid; }

  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; }
  .stat-grid > div { padding: 10px 14px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .stat-grid > div:nth-child(2n) { border-right: none; }
  .stat-grid > div:nth-last-child(-n+2):nth-child(2n) ~ div { border-bottom: none; }
  .stat-v { font-size: 18px; font-weight: 800; }
  .stat-l { font-size: 10px; color: var(--muted); margin-top: 1px; }

  .param-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; }
  .param-grid > div { padding: 14px 8px; text-align: center; border-right: 1px solid var(--border); }
  .param-grid > div:last-child { border-right: none; }
  .param-v { font-size: 22px; font-weight: 900; }
  .param-l { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--text); margin-top: 4px; }
  .param-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

  #activity-map { height: 200px; width: 100%; background: #1a1a1a; }
  .leaflet-container { background: #1a1a1a !important; }
  .activity-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding: 12px 14px; }
  .activity-stats div { text-align: center; }
  .activity-stats .v { font-size: 15px; font-weight: 800; }
  .activity-stats .l { font-size: 9px; color: var(--muted); margin-top: 1px; text-transform: uppercase; letter-spacing: .05em; }

  .zone-bar { display: flex; height: 22px; border-radius: 6px; overflow: hidden; margin: 8px 14px; }
  .zone-bar > div { display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; color: #0008; }
  .zone-legend { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 14px 12px; font-size: 10px; color: var(--muted); }
  .zone-legend span { display: inline-flex; align-items: center; gap: 4px; }
  .zone-legend i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }

  .note { font-size: 11px; color: var(--muted); line-height: 1.5; padding: 0 14px 12px; }
  .note.warn { color: var(--p6); }

  .chart-legend { display: flex; flex-wrap: wrap; gap: 12px; padding: 0 14px 12px; font-size: 10px; color: var(--muted); }
  .chart-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .chart-legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .chart-legend i.dashed { background: none; border: 1.5px dashed var(--muted); }

  .footer-note { text-align: center; font-size: 10px; color: var(--muted); padding: 20px 16px; }

  /* --- Tab Piano --- */
  .countdown { display: grid; grid-template-columns: 1fr 1fr 1fr; background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; margin-bottom: 12px; }
  .countdown > div { padding: 14px 0; text-align: center; border-right: 1px solid var(--border); }
  .countdown > div:last-child { border-right: none; }
  .countdown .v { font-size: 22px; font-weight: 900; color: var(--p6); }
  .countdown .l { font-size: 9px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-top: 2px; }

  .milestone-row { display: flex; align-items: flex-start; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .milestone-row:last-child { border-bottom: none; }
  .milestone-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; margin-top: 4px; }
  .milestone-date { font-size: 10px; color: var(--muted); }
  .milestone-name { font-size: 13px; font-weight: 700; margin-top: 1px; }
  .milestone-detail { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .progress-track { height: 14px; border-radius: 7px; background: #1f2937; overflow: hidden; margin: 8px 0 4px; }
  .progress-fill { height: 100%; border-radius: 7px; background: linear-gradient(90deg,#166534,var(--p1)); transition: width .3s; }
  .progress-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }

  .utmb-year-row { display: flex; align-items: flex-start; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .utmb-year-row:last-child { border-bottom: none; }
  .utmb-year-row.current { background: #0a1628; }
  .utmb-year-dot { width: 30px; flex-shrink: 0; text-align: center; font-size: 13px; font-weight: 900; color: var(--muted); margin-top: 2px; }
  .utmb-year-row.current .utmb-year-dot { color: var(--p2); }
  .utmb-year-race { font-size: 13px; font-weight: 700; }
  .utmb-year-detail { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .utmb-year-stones { font-size: 11px; color: var(--p1); font-weight: 700; margin-top: 2px; }

  .phase-tabs { display: flex; gap: 6px; padding: 0 0 10px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .phase-tab { flex-shrink: 0; padding: 7px 14px; border-radius: 10px; font-size: 12px; font-weight: 700; border: none; cursor: pointer; background: var(--card); color: var(--muted); }
  .phase-tab.active { color: #000; }
  .phase-meta { padding: 0 0 10px; font-size: 11px; color: var(--muted); }

  .week-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; margin-bottom: 8px; }
  .week-head { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 13px 14px; background: none; border: none; cursor: pointer; text-align: left; color: inherit; font: inherit; }
  .week-title-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .week-title { font-size: 14px; font-weight: 800; color: var(--text); }
  .week-badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 99px; }
  .week-dates { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .week-done-count { font-weight: 700; }
  .week-chevron { font-size: 12px; color: var(--muted); }
  .week-body { border-top: 1px solid var(--border); }
  .week-note { margin: 10px 12px 0; background: var(--card2); border: 1px solid var(--border); border-radius: 10px; padding: 9px 11px; font-size: 12px; color: #a0a0a0; line-height: 1.5; }
  .week-days { padding: 10px 12px 12px; }
  .day-row { display: flex; align-items: flex-start; gap: 10px; padding: 7px 9px; border-radius: 10px; margin-bottom: 4px; }
  .day-row.key { background: var(--card2); border: 1px solid var(--border); }
  .day-label { font-size: 10px; font-weight: 700; color: var(--muted); width: 26px; flex-shrink: 0; padding-top: 2px; }
  .day-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
  .day-pill { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; }
  .day-detail { font-size: 11px; color: var(--muted); margin-top: 3px; line-height: 1.4; }
  .day-check { font-size: 13px; flex-shrink: 0; padding-top: 2px; }
  .req-mark { font-size: 11px; margin-left: 6px; vertical-align: middle; }
  .req-legend { display: flex; gap: 12px; padding: 8px 14px 0; font-size: 10px; color: var(--muted); flex-wrap: wrap; }
  .req-legend span { margin-right: 3px; }
  .day-row.done .day-pill { opacity: .55; }
  .day-row.done .day-detail { opacity: .55; }

  /* --- Tab Panoramica --- */
  .heatmap-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 12px; }
  table.heatmap { border-collapse: collapse; font-size: 9px; }
  table.heatmap th, table.heatmap td { min-width: 28px; height: 28px; text-align: center; border: 1px solid var(--border); white-space: nowrap; padding: 0 2px; }
  table.heatmap thead th { font-size: 9px; color: var(--muted); font-weight: 700; background: var(--card); position: sticky; top: 0; z-index: 2; }
  table.heatmap .hm-label { position: sticky; left: 0; z-index: 3; background: var(--card); text-align: left; font-size: 9px; color: var(--muted); padding: 0 6px; min-width: 76px; }
  table.heatmap thead th.hm-label { z-index: 4; }
  table.heatmap .hm-current { outline: 1.5px solid var(--p6); outline-offset: -1.5px; }
  .panorama-legend { display: flex; flex-wrap: wrap; gap: 10px; padding: 10px 14px; font-size: 10px; color: var(--muted); }
  .panorama-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .panorama-legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

  /* --- Tab Forma --- */
  .toggle-row { display: flex; gap: 6px; padding: 0 14px 10px; }
  .toggle-btn { flex: 1; padding: 6px 0; border-radius: 8px; font-size: 11px; font-weight: 700; border: none; cursor: pointer; background: var(--card2); color: var(--muted); }
  .toggle-btn.active { background: var(--p2); color: #000; }
  .threshold-box { display: flex; gap: 10px; padding: 0 14px 12px; }
  .threshold-box > div { flex: 1; background: var(--card2); border-radius: 12px; padding: 12px; text-align: center; }
  .threshold-box .tv { font-size: 20px; font-weight: 900; }
  .threshold-box .tl { font-size: 10px; color: var(--muted); margin-top: 2px; }
  .threshold-box .tp { font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* --- Tab Verdict --- */
  .verdict-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; margin-bottom: 8px; padding: 13px 14px; }
  .verdict-title-row { display: flex; align-items: center; justify-content: space-between; }
  .verdict-title { font-size: 14px; font-weight: 800; }
  .verdict-dates { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .verdict-status { font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 99px; white-space: nowrap; }
</style>
</head>

var C = { p1:"#4ade80", p2:"#60a5fa", p3:"#f97316", p4:"#a78bfa", p5:"#f43f5e", p6:"#fbbf24", muted:"#6b6560" };
var ZONE_COLORS = ["#6b7280", "#60a5fa", "#4ade80", "#f97316", "#f43f5e"];
var ZONE_NAMES = ["Z1", "Z2", "Z3", "Z4", "Z5"];

function esc(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

// --- Decodifica polyline Google (usata da Strava) — algoritmo standard, nessuna libreria esterna ---
function decodePolyline(str) {
  var index = 0, lat = 0, lng = 0, coordinates = [];
  while (index < str.length) {
    var b, shift = 0, result = 0;
    do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
    lat += (result & 1) ? ~(result >> 1) : (result >> 1);
    shift = 0; result = 0;
    do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
    lng += (result & 1) ? ~(result >> 1) : (result >> 1);
    coordinates.push([lat / 1e5, lng / 1e5]);
  }
  return coordinates;
}

function semaforo(w) {
  if (!w) return { bg: "#1c1004", col: "#fbbf24", text: "⚠️ Nessun dato Garmin recente disponibile" };
  var r = 0, y = 0;
  if (w.rhr > 62) r++; else if (w.rhr > 57) y++;
  if (w.bb < 40) r++; else if (w.bb < 60) y++;
  if (w.stress > 50) y++;
  if (w.tr < 40) r++; else if (w.tr < 60) y++;
  if (r >= 2) return { bg: "#1c0808", col: "#f87171", text: "🔴 Segnali di affaticamento — riposo o attività molto leggera oggi" };
  if (r === 1 || y >= 2) return { bg: "#1c1004", col: C.p6, text: "⚠️ Recupero non completo — alleggerisci la sessione del 20–30%" };
  return { bg: "#052e16", col: C.p1, text: "✅ Garmin nella norma — procedi con la sessione pianificata" };
}

// --- SVG line chart: km cumulati giorno per giorno nel blocco corrente,
// con una linea tratteggiata orizzontale per il target pianificato del blocco ---
function blockKmLineSVG(series, targetTotal) {
  var w = 420, h = 150, padL = 28, padR = 8, padT = 12, padB = 22;
  var maxVal = Math.max(targetTotal || 0, series.length ? series[series.length - 1].cumulative_km : 0, 10) * 1.1;
  function x(i) { return series.length > 1 ? padL + i * (w - padL - padR) / (series.length - 1) : padL; }
  function y(v) { return padT + (h - padT - padB) * (1 - v / maxVal); }

  var pathParts = series.map(function(d, i) {
    return (i ? "L" : "M") + x(i).toFixed(1) + "," + y(d.cumulative_km).toFixed(1);
  });
  var lastPt = series.length ? [x(series.length - 1), y(series[series.length - 1].cumulative_km)] : null;

  var targetLine = "";
  if (targetTotal) {
    var ty = y(targetTotal).toFixed(1);
    targetLine =
      '<line x1="' + padL + '" y1="' + ty + '" x2="' + (w - padR) + '" y2="' + ty +
        '" stroke="' + C.muted + '" stroke-width="1.5" stroke-dasharray="3,3" />' +
      '<text x="' + (w - padR) + '" y="' + (parseFloat(ty) - 4) + '" font-size="9" fill="' + C.muted +
        '" text-anchor="end">target ' + targetTotal + ' km</text>';
  }

  var labelStep = Math.max(1, Math.ceil(series.length / 6));
  var xLabels = series.map(function(d, i) {
    if (i % labelStep !== 0 && i !== series.length - 1) return "";
    return '<text x="' + x(i).toFixed(1) + '" y="' + (h - 6) + '" font-size="8" fill="' + C.muted +
      '" text-anchor="middle">' + esc(d.date) + '</text>';
  }).join("");

  return (
    '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;height:auto;display:block">' +
      targetLine +
      '<path d="' + pathParts.join(" ") + '" fill="none" stroke="' + C.p2 + '" stroke-width="1.8" />' +
      (lastPt ? '<circle cx="' + lastPt[0].toFixed(1) + '" cy="' + lastPt[1].toFixed(1) + '" r="3" fill="' + C.p6 + '" />' : "") +
      xLabels +
    '</svg>'
  );
}

function zoneBarHTML(seconds) {
  var total = seconds.reduce(function(a,b){return a+b;}, 0) || 1;
  var bar = seconds.map(function(s, i) {
    var pct = (s / total * 100);
    if (pct < 1) return "";
    return '<div style="width:' + pct.toFixed(1) + '%;background:' + ZONE_COLORS[i] + '">' +
      (pct > 8 ? ZONE_NAMES[i] : "") + '</div>';
  }).join("");
  var legend = seconds.map(function(s, i) {
    var min = Math.round(s / 60);
    return '<span><i style="background:' + ZONE_COLORS[i] + '"></i>' + ZONE_NAMES[i] + ' ' + min + ' min</span>';
  }).join("");
  return '<div class="zone-bar">' + bar + '</div><div class="zone-legend">' + legend + '</div>';
}

function fmtDuration(sec) {
  var h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60);
  return h > 0 ? (h + "h " + m + "min") : (m + " min");
}
function fmtPace(distM, movingS) {
  if (!distM) return "N/A";
  var secPerKm = movingS / (distM / 1000);
  var m = Math.floor(secPerKm / 60), s = Math.round(secPerKm % 60);
  return m + ":" + (s < 10 ? "0" : "") + s + "/km";
}

function fmtPaceFromSec(secPerKm) {
  if (!secPerKm) return "N/A";
  var m = Math.floor(secPerKm / 60), s = Math.round(secPerKm % 60);
  return m + ":" + (s < 10 ? "0" : "") + s + "/km";
}

// Fasce cardiache di riferimento (Z1-Z5), calcolate lato Python da AeT/AnT/
// FCmax in contesto-allenamento.md — 5 segmenti a LARGHEZZA UGUALE (non
// proporzionale ai bpm: Z3 può essere larga solo 3 bpm, con una barra
// proporzionale i numeri si accavallano e diventa illeggibile). Ogni
// segmento porta il proprio nome + range, quindi resta leggibile a
// prescindere da quanto è fisiologicamente stretta quella zona.
function fasceCardiacheSVG(zones) {
  var names = ["Z1", "Z2", "Z3", "Z4", "Z5+"];
  var colors = ["#6b7280", "#4ade80", "#fbbf24", "#f97316", "#f43f5e"];
  var displayFloor = 100; // solo per l'etichetta di Z1 — la classificazione dati reale resta invariata

  var segs = zones.map(function(z, i) {
    var lo = (i === 0) ? Math.max(z.min, displayFloor) : z.min;
    var rangeLabel = (i === zones.length - 1) ? (lo + "+") : (lo + "–" + z.max);
    return (
      '<div style="flex:1;background:' + colors[i] + ';padding:10px 4px;text-align:center;' +
        (i > 0 ? 'border-left:2px solid var(--bg);' : '') + '">' +
        '<div style="font-size:12px;font-weight:900;color:#0009">' + names[i] + '</div>' +
        '<div style="font-size:11px;font-weight:700;color:#0008;margin-top:2px;white-space:nowrap">' + rangeLabel + '</div>' +
      '</div>'
    );
  }).join("");

  return '<div style="display:flex;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.3)">' + segs + '</div>';
}

    var warn = agg.low_aerobic_flag
      ? '<div class="note warn">⚠️ Z1+Z2 al ' + agg.z1z2_pct + '% — sotto il 60% consigliato per il volume aerobico di base.</div>'
      : '<div class="note">Z1+Z2: ' + agg.z1z2_pct + '% del tempo (' + agg.n_activities + ' attività con dati FC in questo periodo).</div>';
    body = zoneBarHTML(agg.zone_seconds) + warn;
  }
  document.getElementById("zone-agg-body").innerHTML = body;
}

function nutritionCardHTML() {
  var ns = DATA.nutrition_status;
  var tests = DATA.nutrition_tests || [];
  var lastTest = tests.length ? tests[tests.length - 1] : null;

  var choRow = ns.cho_target
    ? '<div class="param-v" style="color:' + C.p3 + '">' + esc(ns.cho_target) + '</div>' +
      '<div class="param-l">CHO/ora — ' + esc(ns.phase_name) + '</div>' +
      '<div class="param-sub">' + esc(ns.cho_detail) + '</div>'
    : '<div class="param-sub">' + esc(ns.cho_detail || "Nessun target per questo blocco.") + '</div>';

  var sweatRow;
  if (lastTest) {
    sweatRow =
      '<div class="param-v" style="color:' + C.p2 + '">' + esc(lastTest.weight_loss_pct) + '%</div>' +
      '<div class="param-l">Ultimo sweat test</div>' +
      '<div class="param-sub">' + esc(lastTest.date) + ' · ' + esc(lastTest.conditions || "") + '</div>';
  } else {
    sweatRow = '<div class="param-sub">Nessun sweat test registrato ancora.</div>';
  }

  var nextTest = ns.next_sweat_test
    ? 'Prossimo test in agenda: <b>' + esc(ns.next_sweat_test.when) + '</b> — ' + esc(ns.next_sweat_test.desc)
    : "Nessun altro test in programma.";

  return (
    '<div class="card">' +
      '<div class="card-head"><span class="label">🥤 Cibo e idratazione</span></div>' +
      '<div class="card-body" style="padding-bottom:6px">' + choRow + '</div>' +
      '<div class="card-body" style="border-top:1px solid var(--border);padding-top:12px">' + sweatRow + '</div>' +
      '<div class="note">' + nextTest + '</div>' +
    '</div>'
  );
}

function renderForma() {
  var vo2Latest = DATA.vo2max_entries.length ? DATA.vo2max_entries[DATA.vo2max_entries.length - 1] : null;
  var aetEntries = DATA.threshold_tests.filter(function(t){ return t.type === "AeT"; });
  var antEntries = DATA.threshold_tests.filter(function(t){ return t.type === "AnT"; });
  var aetLatest = aetEntries[aetEntries.length - 1];
  var antLatest = antEntries[antEntries.length - 1];
  var isEstimate = aetEntries.length <= 1;
  var blockLabel = DATA.current_block ? DATA.current_block.name : null;

  document.getElementById("page-forma").innerHTML =
    '<div class="card">' +
      '<div class="param-grid">' +
        '<div>' +
          '<div class="param-v" style="color:' + C.p1 + '">' + (vo2Latest ? vo2Latest.vo2max : "N/A") + '</div>' +
          '<div class="param-l">VO2max</div>' +
          '<div class="param-sub">' + (vo2Latest ? esc(vo2Latest.date.split("-").reverse().join("/")) : "N/A") + '</div>' +
        '</div>' +
        '<div>' +
          '<div class="param-v" style="color:' + C.p2 + '">' + (aetLatest ? aetLatest.hr : "N/A") + '</div>' +
          '<div class="param-l">AeT · LT1</div>' +
          '<div class="param-sub">' + fmtPaceFromSec(aetLatest ? aetLatest.pace_sec_per_km : null) + '</div>' +
        '</div>' +
        '<div>' +
          '<div class="param-v" style="color:' + C.p4 + '">' + (antLatest ? antLatest.hr : "N/A") + '</div>' +
          '<div class="param-l">AnT · LT2</div>' +
          '<div class="param-sub">' + fmtPaceFromSec(antLatest ? antLatest.pace_sec_per_km : null) + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="note">' + (isEstimate
        ? "Ancora nessun test reale su questo piano — valori da stima storica, verranno aggiornati dopo i test di settembre 2026."
        : "FC in bpm.") + '</div>' +
    '</div>' +
    '<div class="card">' +
      '<div class="card-head"><span class="label">🎚️ Fasce cardiache</span></div>' +
      '<div class="card-body">' + fasceCardiacheSVG(DATA.hr_zones_def) + '</div>' +
      '<div class="note">Derivate da AeT/AnT/FC massima qui sopra — si aggiornano da sole quando quei valori cambiano.</div>' +
    '</div>' +
    '<div class="card">' +
      '<div class="card-head"><span class="label">📊 Zone cardiache aggregate</span></div>' +
      '<div class="toggle-row" style="padding-top:12px">' +
        '<button class="toggle-btn active" data-period="all">Tutto il piano</button>' +
        '<button class="toggle-btn" data-period="block">' + (blockLabel ? "Blocco " + esc(blockLabel) : "Per blocco") + '</button>' +
      '</div>' +
      '<div id="zone-agg-body" class="card-body"></div>' +
    '</div>' +
    nutritionCardHTML();

  renderZoneAggregate();
  Array.prototype.forEach.call(document.querySelectorAll("#page-forma .toggle-btn"), function(btn) {
    btn.addEventListener("click", function() {
      document.querySelectorAll("#page-forma .toggle-btn").forEach(function(b){ b.classList.remove("active"); });
      btn.classList.add("active");
      formaState.period = btn.getAttribute("data-period");
      renderZoneAggregate();
    });
  });
}

// aggiornato 19/09/2026: piano esteso 40→62 settimane, obiettivo Monte Rosa
// Trail 82K (S46) + Puglia 100K (S62), confermato da Leonardo in chat.
var PLANNED_KM = [
  14,14,14,22,30,33,36,20,38,25,44,48,26,52,57,62,34,64,70,76,
  42,78,82,86,48,80,84,88,50,75,45,68,82,52,55,30,72,80,88,50,
  82,86,90,50,35,90,25,52,60,66,38,62,68,28,58,65,40,62,68,38,
  50,87
];

function mondayOnOrBefore(d) {
  var day = d.getDay(); // 0=Dom..6=Sab
  var diff = (day === 0) ? 6 : day - 1;
  var m = new Date(d.getFullYear(), d.getMonth(), d.getDate() - diff);
  return m;
}
var PLAN_WEEK1_MONDAY = mondayOnOrBefore(new Date(2026, 8, 1)); // 1 settembre 2026

function weekIndexForDate(d) {
  var days = Math.floor((mondayOnOrBefore(d) - PLAN_WEEK1_MONDAY) / 86400000);
  return Math.floor(days / 7);
}
function currentWeekNumber() {
  return weekIndexForDate(new Date()) + 1;
}

function dateForWeekDay(weekNum, dayIdx) {
  var weekMonday = new Date(PLAN_WEEK1_MONDAY.getTime() + (weekNum - 1) * 7 * 86400000);
  var d = new Date(weekMonday.getTime() + dayIdx * 86400000);
  var mm = String(d.getMonth() + 1).padStart(2, "0");
  var dd = String(d.getDate()).padStart(2, "0");
  return d.getFullYear() + "-" + mm + "-" + dd;
}

function computeWeekMetrics(week) {
  var phase = PHASES.filter(function(p){ return p.id === week.p; })[0];
  var easy = 0, quality = 0, trailKmTotal = 0, trailKmMax = 0, runKm = 0, bikeMin = 0;
  var gymDays = [], skimo = false, testType = null, raceName = null;

  week.days.forEach(function(d) {
    var label = d.l || "";
    if (d.t === "run") {
      var mk = /([\d.]+)\s*km/.exec(label);
      var km = mk ? parseFloat(mk[1]) : 0;
      runKm += km;
      if (/qualit|progressivo/i.test(label)) quality++; else easy++;
    } else if (d.t === "bike") {
      easy++;
      var mb = /(\d+)\s*min/.exec(label);
      if (mb) bikeMin += parseInt(mb[1], 10);
    } else if (d.t === "trail") {
      // Alcune settimane hanno due uscite trail (long + back-to-back il
      // giorno dopo): "Trail lungo" nell'heatmap deve mostrare la singola
      // uscita più lunga, non la somma delle due (altrimenti un 37+13
      // diventa un fantomatico "50 km" che in realtà non esiste come sessione).
      var mt = /([\d.]+)\s*km/.exec(label);
      if (mt) {
        var km2 = parseFloat(mt[1]);
        trailKmTotal += km2;
        trailKmMax = Math.max(trailKmMax, km2);
      }
    } else if (d.t === "gym") {
      var mg = /Giorno\s*(\d)/.exec(label);
      if (mg) gymDays.push(mg[1]);
    } else if (d.t === "skimo") {
      skimo = true;
    } else if (d.t === "test") {
      testType = /AnT/i.test(label) ? "AnT" : "AeT";
    } else if (d.t === "race") {
      raceName = label.replace(/[^\w\sÀ-ÿ]/g, "").trim();
    }
  });

  return {
    phase: phase, plannedKm: PLANNED_KM[week.w - 1],
    easy: easy, quality: quality,
    trailKmMax: trailKmMax, trailKmTotal: trailKmTotal,
    runKm: runKm, bikeMin: bikeMin,
    bikeEquivKm: bikeMin / 3, gymDays: gymDays, skimo: skimo, testType: testType, raceName: raceName,
  };
}

function heatmapCell(key, m, weekNum, maxTrail, maxBike, isCur) {
  var curClass = isCur ? " hm-current" : "";
  if (key === "phase") {
    return '<td class="hm-cell' + curClass + '" style="background:' + m.phase.col + '33;color:' + m.phase.col + ';font-weight:700">' + esc(m.phase.name.slice(0, 3)) + '</td>';
  }
  if (key === "volume") {
    var opV = Math.max(0.12, m.plannedKm / 66);
    return '<td class="hm-cell' + curClass + '" style="background:rgba(96,165,250,' + opV.toFixed(2) + ')">' + m.plannedKm + '</td>';
  }
  if (key === "easy") {
    var opE = m.easy ? Math.min(1, 0.2 + m.easy * 0.18) : 0;
    return '<td class="hm-cell' + curClass + '" style="background:rgba(74,222,128,' + opE.toFixed(2) + ')">' + (m.easy || "") + '</td>';
  }
  if (key === "quality") {
    var opQ = m.quality ? Math.min(1, 0.25 + m.quality * 0.25) : 0;
    return '<td class="hm-cell' + curClass + '" style="background:rgba(249,115,22,' + opQ.toFixed(2) + ')">' + (m.quality || "") + '</td>';
  }
  if (key === "trail") {
    var opT = m.trailKmMax ? Math.max(0.15, m.trailKmMax / maxTrail) : 0;
    return '<td class="hm-cell' + curClass + '" style="background:rgba(74,222,128,' + opT.toFixed(2) + ')">' + (m.trailKmMax || "") + '</td>';
  }
  if (key === "bike") {
    var opB = m.bikeMin ? Math.max(0.15, m.bikeMin / maxBike) : 0;
    return '<td class="hm-cell' + curClass + '" style="background:rgba(249,115,22,' + opB.toFixed(2) + ')">' + (m.bikeMin || "") + '</td>';
  }
  if (key === "gym") {
    var gymLabel = m.gymDays.length ? m.gymDays.map(function(g){ return "G" + g; }).join("+") : "";
    return '<td class="hm-cell' + curClass + '" style="color:#a78bfa;font-weight:700;font-size:' + (m.gymDays.length > 1 ? "7px" : "9px") + '">' + gymLabel + '</td>';
  }
  if (key === "skimo") {
    return '<td class="hm-cell' + curClass + '" style="color:#bae6fd">' + (m.skimo ? "✓" : "") + '</td>';
  }
  if (key === "test") {
    return '<td class="hm-cell' + curClass + '" style="color:#f43f5e;font-weight:700">' + (m.testType || "") + '</td>';
  }
  if (key === "race") {
    return '<td class="hm-cell' + curClass + '" style="color:#fbbf24;font-weight:700;font-size:8px">' + esc(m.raceName || "") + '</td>';
  }
  return '<td class="hm-cell' + curClass + '"></td>';
}

function renderHeatmap(metrics) {
  var rows = [
    ["phase", "Fase"], ["volume", "Volume km"], ["easy", "Easy Z2"], ["quality", "Qualità"],
    ["trail", "Trail lungo"], ["bike", "Bici (min)"], ["gym", "Palestra"],
    ["skimo", "Skimo"], ["test", "Test"], ["race", "Gara"],
  ];
  var maxTrail = Math.max.apply(null, metrics.map(function(m){ return m.trailKmMax; }).concat([1]));
  var maxBike = Math.max.apply(null, metrics.map(function(m){ return m.bikeMin; }).concat([1]));
  var curWeek = currentWeekNumber();

  var head = '<tr><th class="hm-label"></th>' + W.map(function(w) {
    return '<th class="' + (w.w === curWeek ? "hm-current" : "") + '">S' + w.w + '</th>';
  }).join("") + '</tr>';

  var body = rows.map(function(row) {
    var key = row[0], label = row[1];
    var cells = W.map(function(w, i) {
      return heatmapCell(key, metrics[i], w.w, maxTrail, maxBike, w.w === curWeek);
    }).join("");
    return '<tr><td class="hm-label">' + esc(label) + '</td>' + cells + '</tr>';
  }).join("");

  return '<div class="heatmap-scroll"><table class="heatmap"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>';
}

function stackedChartSVG(metrics) {
  var w = 900, h = 190, padL = 6, padR = 6, padT = 10, padB = 32;
  var totals = metrics.map(function(m) { return m.trailKmTotal + m.runKm + m.bikeEquivKm + (m.skimo ? 5 : 0); });
  var actualSeries = DATA.weekly_actual_km || [];
  var maxVal = Math.max.apply(null, totals.concat(actualSeries).concat([10]));
  var n = metrics.length;
  var groupW = (w - padL - padR) / n;
  var barW = groupW * 0.7;
  var curWeek = currentWeekNumber();

  function yOf(v) { return padT + (h - padT - padB) * (1 - v / maxVal); }

  var bars = "", markers = "", linePts = [];
  metrics.forEach(function(m, i) {
    var x = padL + i * groupW + (groupW - barW) / 2;
    var curY = h - padB;
    var segs = [
      { v: m.trailKmTotal, color: "#166534" },
      { v: m.runKm, color: "#60a5fa" },
      { v: m.bikeEquivKm, color: "#f97316" },
      { v: m.skimo ? 5 : 0, color: "#f0ede8" },
    ];
    segs.forEach(function(s) {
      if (s.v <= 0) return;
      var segH = (h - padT - padB) * (s.v / maxVal);
      curY -= segH;
      bars += '<rect x="' + x.toFixed(1) + '" y="' + curY.toFixed(1) + '" width="' + barW.toFixed(1) + '" height="' + segH.toFixed(1) + '" fill="' + s.color + '" />';
    });

    if (W[i].w === curWeek) {
      var totH = (h - padT - padB) * (totals[i] / maxVal);
      bars += '<rect x="' + (x - 1).toFixed(1) + '" y="' + (h - padB - totH - 1).toFixed(1) + '" width="' + (barW + 2).toFixed(1) + '" height="' + (totH + 2).toFixed(1) + '" fill="none" stroke="#fbbf24" stroke-width="1.2" />';
    }

    var midX = x + barW / 2;
    var mark = "";
    if (m.testType) mark = "🔬";
    else if (m.raceName) mark = "🏁";
    else if (/scarico/i.test(W[i].note || "")) mark = "⚡";
    if (mark) markers += '<text x="' + midX.toFixed(1) + '" y="' + (h - padB + 14) + '" font-size="8" text-anchor="middle">' + mark + '</text>';

    linePts.push([midX, yOf(actualSeries[i] || 0)]);
  });

  var linePath = linePts.map(function(p, i) { return (i ? "L" : "M") + p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ");

  return (
    '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;height:auto;display:block">' +
      bars +
      '<path d="' + linePath + '" fill="none" stroke="#fbbf24" stroke-width="1.3" opacity="0.85" />' +
      markers +
    '</svg>'
  );
}

// Timeline orizzontale set 2026 -> giu 2027, marker solo per test/gare/scarichi
function timelineMilestonesSVG() {
  var planStart = PLAN_WEEK1_MONDAY;
  var planEnd = new Date(planStart.getTime() + 39 * 7 * 86400000 + 6 * 86400000);
  var totalMs = planEnd - planStart;

  var markers = [];
  W.forEach(function(week) {
    var wStart = new Date(planStart.getTime() + (week.w - 1) * 7 * 86400000);
    var frac = (wStart - planStart) / totalMs;
    var hasTest = week.days.some(function(d){ return d.t === "test"; });
    var raceDay = week.days.filter(function(d){ return d.t === "race"; })[0];
    var isScarico = /scarico/i.test(week.note || "");
    if (hasTest) {
      var testLabel = week.days.filter(function(d){ return d.t === "test"; })[0].l.replace(/[^\w\sÀ-ÿ]/g, "").trim();
      markers.push({ frac: frac, icon: "🔬", label: testLabel, date: wStart });
    }
    if (raceDay) {
      markers.push({ frac: frac, icon: "🏁", label: raceDay.l.replace(/[^\w\sÀ-ÿ]/g, "").trim(), date: wStart });
    } else if (isScarico) {
      markers.push({ frac: frac, icon: "⚡", label: "Scarico", date: wStart });
    }
  });

  var w = Math.max(500, markers.length * 90), h = 90, padL = 16, padR = 16, midY = 30;
  var line = '<line x1="' + padL + '" y1="' + midY + '" x2="' + (w - padR) + '" y2="' + midY + '" stroke="var(--border)" stroke-width="2" />';
  var items = markers.map(function(m) {
    var x = padL + m.frac * (w - padL - padR);
    var dateLabel = m.date.toLocaleDateString("it-IT", { day: "2-digit", month: "short" });
    return (
      '<g>' +
        '<circle cx="' + x.toFixed(1) + '" cy="' + midY + '" r="4" fill="var(--card)" stroke="var(--p6)" stroke-width="1.5" />' +
        '<text x="' + x.toFixed(1) + '" y="' + (midY - 12) + '" font-size="13" text-anchor="middle">' + m.icon + '</text>' +
        '<text x="' + x.toFixed(1) + '" y="' + (midY + 20) + '" font-size="8" fill="var(--text)" text-anchor="middle" font-weight="700">' + esc(m.label.slice(0, 14)) + '</text>' +
        '<text x="' + x.toFixed(1) + '" y="' + (midY + 32) + '" font-size="7" fill="var(--muted)" text-anchor="middle">' + esc(dateLabel) + '</text>' +
      '</g>'
    );
  }).join("");

  return (
    '<div style="overflow-x:auto;-webkit-overflow-scrolling:touch">' +
      '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:' + w + 'px;height:' + h + 'px;display:block">' +
        line + items +
      '</svg>' +
    '</div>'
  );
}

// Gerarchia priorità sessioni — da contesto-allenamento.md §"Gerarchia
// Sessioni - Cosa Saltare se Non Hai Tempo" (3 livelli, non solo
// obbligatorio/opzionale): 🔴 mai saltare, 🟡 quasi mai, 🟢 saltabile.
// Le tabelle del libro raggruppano le fasi in 3 blocchi: Restart (S1-4),
// Base (S5-24, include anche Aerobico), Specifico (S25-38, include anche
// Picco/inizio Taper) — i confini usati qui riprendono esattamente quelli.
function sessionPriority(day, dayLabel, weekNum) {
  if (day.t === "rest") return null;
  if (day.t === "test") return { sym: "🔴", cls: "never", label: "Mai saltare — calibra tutto il piano" };
  if (day.t === "race") return { sym: "🔴", cls: "never", label: "Gara" };

  var group = weekNum <= 4 ? "restart" : weekNum <= 24 ? "base" : "specifico";

  if (group === "restart") {
    if (dayLabel === "Mar" || dayLabel === "Mer") return { sym: "🟡", cls: "rare", label: "Quasi mai saltare" };
    return { sym: "🟢", cls: "skip", label: "Saltabile" };
  }
  if (group === "base") {
    if (dayLabel === "Mar") return { sym: "🔴", cls: "never", label: "Mai saltare — Hill Sprints, adattamento neurale" };
    if (dayLabel === "Sab" && day.t === "trail") return { sym: "🔴", cls: "never", label: "Mai saltare — 30-40% volume settimana" };
    if (dayLabel === "Ven" || dayLabel === "Mer") return { sym: "🟡", cls: "rare", label: "Quasi mai saltare" };
    return { sym: "🟢", cls: "skip", label: "Saltabile" };
  }
  // specifico
  if (dayLabel === "Mar") return { sym: "🔴", cls: "never", label: "Mai saltare — Hill Sprints" };
  if ((dayLabel === "Sab" || dayLabel === "Dom") && day.t === "trail") return { sym: "🔴", cls: "never", label: "Mai saltare — back-to-back" };
  if (dayLabel === "Ven" || dayLabel === "Mer") return { sym: "🟡", cls: "rare", label: "Quasi mai saltare" };
  return { sym: "🟢", cls: "skip", label: "Saltabile" };
}

function renderDayRow(day, dayLabel, dateStr, weekNum) {

  var icon = ICONS[day.t] || "";

  var detail = day.x ? '<div class="day-detail">' + esc(day.x) + '</div>' : "";

  var check = isDone ? '<div class="day-check" title="Fatta (Strava, ' + esc(dateStr) + ')">✅</div>' : "";

  return (

  );
}

function renderWeekCard(week) {
  var isOpen = planState.openWeek === week.w;
  var hasRace = week.days.some(function(d){ return d.t === "race"; });
  var hasTest = week.days.some(function(d){ return d.t === "test"; });
  var badge = "";
  if (hasRace) badge = '<span class="week-badge" style="background:#1c1004;color:#fbbf24">🏁</span>';
  else if (hasTest) badge = '<span class="week-badge" style="background:#1c0808;color:#fca5a5">🔬</span>';
  else if (week.sp) badge = '<span class="week-badge" style="background:#1e0a3c;color:#c4b5fd">' + esc(week.sp) + '</span>';

  var doneCount = 0, plannedCount = 0;
  week.days.forEach(function(d, i) {
    if (d.t === "rest") return;
    plannedCount++;
    if (DATA.completed_dates.indexOf(dateForWeekDay(week.w, i)) !== -1) doneCount++;
  });
  var doneColor = plannedCount && doneCount === plannedCount ? C.p1 : "var(--muted)";
  var doneCounter = '<span class="week-done-count" style="color:' + doneColor + '">' + doneCount + '/' + plannedCount + ' completati</span>';

  var body = "";
  if (isOpen) {
    var note = week.note ? '<div class="week-note">' + esc(week.note) + '</div>' : "";
    var days = week.days.map(function(d, i) { return renderDayRow(d, DAYS[i], dateForWeekDay(week.w, i), week.w); }).join("");
    body = '<div class="week-body">' + note + '<div class="week-days">' + days + '</div></div>';
  }

  return (
    '<div class="week-card">' +
      '<button class="week-head" data-week="' + week.w + '">' +
        '<div>' +
          '<div class="week-title-row"><span class="week-title">Settimana ' + week.w + '</span>' + badge + '</div>' +
          '<div class="week-dates">' + esc(week.d) + ' · ' + doneCounter + '</div>' +
        '</div>' +
        '<span class="week-chevron">' + (isOpen ? "▲" : "▼") + '</span>' +
      '</button>' + body +
    '</div>'
  );
}

function renderWeeksList() {
  var phaseWeeks = W.filter(function(w){ return w.p === planState.phase; });
  document.getElementById("plan-weeks").innerHTML = phaseWeeks.map(renderWeekCard).join("");
  Array.prototype.forEach.call(document.querySelectorAll("#plan-weeks .week-head"), function(btn) {
    btn.addEventListener("click", function() {
      var w = parseInt(btn.getAttribute("data-week"), 10);
      planState.openWeek = (planState.openWeek === w) ? null : w;
      renderWeeksList();
    });
  });
}

function renderPhaseTabs() {
  var tabs = PHASES.map(function(ph) {
    var active = ph.id === planState.phase;
    return '<button class="phase-tab' + (active ? " active" : "") + '" data-phase="' + ph.id +
      '" style="background:' + (active ? ph.col : "var(--card)") + '">' + esc(ph.name) + '</button>';
  }).join("");
  document.getElementById("plan-phase-tabs").innerHTML = tabs;
  document.getElementById("plan-phase-meta").textContent = PHASES.filter(function(p){return p.id===planState.phase;})[0].meta;
  Array.prototype.forEach.call(document.querySelectorAll("#plan-phase-tabs .phase-tab"), function(btn) {
    btn.addEventListener("click", function() {
      planState.phase = parseInt(btn.getAttribute("data-phase"), 10);
      planState.openWeek = null;
      renderPhaseTabs();
      renderWeeksList();
    });
  });
}

function renderPiano() {
  var days = daysTo("2027-06-26");
  var countdown = [
    {v:days,l:"giorni"},{v:Math.ceil(days/7),l:"settimane"},{v:currentPhase(),l:"fase"}
  ].map(function(item){
    return '<div><div class="v">' + esc(item.v) + '</div><div class="l">' + esc(item.l) + '</div></div>';
  }).join("");

  var milestones = ROADMAP.map(function(r){
    return (
      '<div class="milestone-row">' +
        '<div class="milestone-dot" style="background:' + r.col + '"></div>' +
        '<div>' +
          '<div class="milestone-date">' + esc(r.date) + '</div>' +
          '<div class="milestone-name" style="color:' + (r.gold ? "#fbbf24" : "inherit") + '">' + esc(r.name) + '</div>' +
          '<div class="milestone-detail">' + esc(r.detail) + '</div>' +
        '</div>' +
      '</div>'
    );
  }).join("");

  var metrics = W.map(computeWeekMetrics);

  document.getElementById("page-piano").innerHTML =
    '<div class="countdown">' + countdown + '</div>' +
    '<div class="card">' +
      '<div class="card-head"><span class="label">Milestone</span></div>' +
      milestones +
    '</div>' +
    panoramicaHTML(metrics) +
    raceRemindersHTML();
}

function renderBlocchi() {
  document.getElementById("page-blocchi").innerHTML =
    '<div id="plan-phase-tabs" class="phase-tabs"></div>' +
    '<div id="plan-phase-meta" class="phase-meta"></div>' +
    '<div class="req-legend"><span>🔴</span>mai saltare<span>🟡</span>quasi mai<span>🟢</span>saltabile</div>' +
    '<div id="plan-weeks"></div>';

  renderPhaseTabs();
  renderWeeksList();
}

// ============================================================
// TAB UTMB — percorso Running Stones verso la lotteria UTMB Mont-Blanc
// (dati statici da contesto-allenamento.md § "Percorso UTMB — Strategia
// Running Stones", aggiornare qui a mano quando cambia la roadmap).
// ============================================================

// Aggiornato 19/09/2026 — roadmap sostituita per intero: obiettivo non più
// Lavaredo 80K/120K → UTMB 2030-31, ma Monte Rosa 82K + Puglia 100K (2027)
// → LUT 120K (2030, sblocca Index 100M) → UTMB 2032. Confermato da
// Leonardo in chat dopo che il file conteneva due roadmap incompatibili.
var UTMB_STONES_TARGET = 31;
var UTMB_STONES_CURRENT = 0;
var UTMB_CURRENT_YEAR = 2026;

var UTMB_ROADMAP = [
  {year: 2026, race: "—", gained: "0", total: 0, index: "50K (scade ago 2027)", note: "Anno di base"},
  {year: 2027, race: "Monte Rosa 82K (lug)", gained: "+3", total: 3, index: "100K · A-race 2027", note: "Prima WS race"},
  {year: 2027, race: "Puglia 100K (nov)", gained: "+3", total: 6, index: "100K", note: "A-race autunno 2027"},
  {year: 2028, race: "LUT 80K (garantita, giu)", gained: "+3", total: 9, index: "100K refresh", note: "Primo vero 80K+"},
  {year: 2029, race: "WS 100K gara 1 (tbd)", gained: "+3", total: 12, index: "100K", note: ""},
  {year: 2029, race: "WS 100K gara 2 (tbd)", gained: "+3", total: 15, index: "100K", note: ""},
  {year: 2030, race: "LUT 120K (giu)", gained: "+5", total: 20, index: "100M sbloccato 🏆", note: "Index 100M sbloccato"},
  {year: 2031, race: "Val d'Aran Major (lug)", gained: "+6", total: 26, index: "100K Major", note: "Doppio stones"},
  {year: 2031, race: "Grossglockner 110K (lug)", gained: "+5", total: 31, index: "100M", note: "Seconda 100M"},
  {year: 2032, race: "UTMB Mont-Blanc", gained: "—", total: 31, index: "100M valido", note: "Età 40 🏆 · ~65-67% estrazione"},
];

var UTMB_PROB_TABLE = [
  {min: 1, max: 3, label: "1-3", prob: "~5-8%"},
  {min: 4, max: 7, label: "4-7", prob: "~10-15%"},
  {min: 8, max: 12, label: "8-12", prob: "~20-30%"},
  {min: 13, max: 17, label: "13-17", prob: "~35-50%"},
  {min: 18, max: 22, label: "18-22", prob: "~60-75%"},
  {min: 23, max: Infinity, label: "23+", prob: "~80%+"},
];

function utmbProbabilityFor(stones) {
  if (stones < 1) return null; // serve almeno 1 stone negli ultimi 24 mesi
  for (var i = 0; i < UTMB_PROB_TABLE.length; i++) {
    if (stones >= UTMB_PROB_TABLE[i].min && stones <= UTMB_PROB_TABLE[i].max) return UTMB_PROB_TABLE[i];
  }
  return null;
}

function renderUtmb() {
  var pct = Math.round((UTMB_STONES_CURRENT / UTMB_STONES_TARGET) * 100);
  var prob = utmbProbabilityFor(UTMB_STONES_CURRENT);

  var years = UTMB_ROADMAP.map(function(r) {
    var isCurrent = r.year === UTMB_CURRENT_YEAR;
    return (
      '<div class="utmb-year-row' + (isCurrent ? " current" : "") + '">' +
        '<div class="utmb-year-dot">' + r.year + '</div>' +
        '<div>' +
          '<div class="utmb-year-race">' + esc(r.race) + '</div>' +
          '<div class="utmb-year-detail">Index: ' + esc(r.index) + ' · ' + esc(r.note) + '</div>' +
          '<div class="utmb-year-stones">' + esc(r.gained) + ' stones → totale ' + r.total + '</div>' +
        '</div>' +
      '</div>'
    );
  }).join("");

  // barra probabilità: posiziona un marcatore sulla fascia corrente del target 20
  var probBarSegs = UTMB_PROB_TABLE.map(function(band, i) {
    var isTargetBand = UTMB_STONES_TARGET >= band.min && UTMB_STONES_TARGET <= band.max;
    return (
      '<div style="flex:1;background:' + (isTargetBand ? C.p1 : "#242424") + ';padding:8px 2px;text-align:center;' +
        (i > 0 ? "border-left:2px solid var(--bg);" : "") + '">' +
        '<div style="font-size:10px;font-weight:800;color:' + (isTargetBand ? "#0009" : "var(--muted)") + '">' + band.label + '</div>' +
        '<div style="font-size:9px;font-weight:700;color:' + (isTargetBand ? "#0008" : "var(--muted)") + '">' + band.prob + '</div>' +
      '</div>'
    );
  }).join("");

  document.getElementById("page-utmb").innerHTML =
    '<div class="card"><div class="card-body">' +
      '<div class="param-l" style="margin-bottom:2px">RUNNING STONES</div>' +
      '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
      '<div class="progress-label"><span>' + UTMB_STONES_CURRENT + ' accumulate</span><span>target ' + UTMB_STONES_TARGET + ' (' + pct + '%)</span></div>' +
      '<div class="note" style="padding:8px 0 0">Stones per gara WS completata: 20K=1 · 50K=2 · 100K=3 · 100M=4. Non scadono mai.</div>' +
    '</div></div>' +

    '<div class="card"><div class="card-body" style="text-align:center;padding:14px">' +
      '<div class="param-l" style="margin-bottom:4px">UTMB INDEX</div>' +
      '<div style="font-size:26px;font-weight:900;color:' + C.p6 + '">503</div>' +
      '<div class="param-sub">categoria 50K · scade 1 agosto 2027</div>' +
      '<div class="note" style="padding:6px 0 0">Prossimo refresh con Monte Rosa Trail 82K (lug 2027) → sblocca categoria 100K.</div>' +
    '</div></div>' +

    '<div class="card">' +
      '<div class="card-head"><span class="label">🎯 Probabilità di estrazione</span></div>' +
      '<div class="card-body" style="padding-top:12px">' +
        '<div style="display:flex;border-radius:10px;overflow:hidden;margin-bottom:8px">' + probBarSegs + '</div>' +
        '<div class="note" style="padding:0">' + (prob
          ? "Con " + UTMB_STONES_CURRENT + " stones: " + prob.prob + " di probabilità di estrazione UTMB."
          : "Con " + UTMB_STONES_CURRENT + " stones non sei ancora idoneo alla lotteria — serve almeno 1 stone (una gara World Series completata) negli ultimi 24 mesi. La fascia evidenziata sopra (" + UTMB_STONES_TARGET + ") è il target roadmap.") +
        '</div>' +
      '</div>' +
    '</div>' +

    '<div class="card">' +
      '<div class="card-head"><span class="label">🗺️ Percorso 2026 → 2032</span></div>' +
      years +
    '</div>' +

    '<div class="note" style="padding:0 0 12px">' +
      'Con 31 stones nel 2032: ~65-67% di probabilità stimata (valore specifico da roadmap, leggermente sotto la fascia generica "23+" della tabella sopra). ' +
      'Punto critico: il 2030 sblocca l\'Index 100M (via LUT 120K), senza il quale non si entra in lotteria per UTMB.' +
    '</div>';
}

// ============================================================
// TAB VERDICT — analisi di fine blocco (Claude Code, non generata
// automaticamente qui: JS mostra solo lo stato "in attesa" finché
// non c'è un blocco completato con dati reali da analizzare).
// ============================================================

function phaseEndDateLabel(phaseId) {
  var weeks = W.filter(function(w){ return w.p === phaseId; });
  var last = weeks[weeks.length - 1];
  return last ? last.d.split(/[–-]/).pop().trim() : "";
}

function renderVerdict() {
  var curWeek = currentWeekNumber();
  var cards = PHASES.map(function(ph) {
    var weeks = W.filter(function(w){ return w.p === ph.id; });
    var firstW = weeks[0].w, lastW = weeks[weeks.length - 1].w;
    var status, statusBg, statusCol;
    if (curWeek > lastW) { status = "Da generare"; statusBg = "#1c1004"; statusCol = C.p6; }
    else if (curWeek >= firstW && curWeek <= lastW) { status = "In corso"; statusBg = "#0a1628"; statusCol = C.p2; }
    else { status = "In attesa"; statusBg = "#1f2937"; statusCol = C.muted; }
    return (
      '<div class="verdict-card">' +
        '<div class="verdict-title-row">' +
          '<div>' +
            '<div class="verdict-title" style="color:' + ph.col + '">' + esc(ph.name) + '</div>' +
            '<div class="verdict-dates">Settimane ' + firstW + '–' + lastW + ' · fino al ' + esc(phaseEndDateLabel(ph.id)) + '</div>' +
          '</div>' +
          '<span class="verdict-status" style="background:' + statusBg + ';color:' + statusCol + '">' + status + '</span>' +
        '</div>' +
      '</div>'
    );
  }).join("");

  document.getElementById("page-verdict").innerHTML =
    '<div class="note" style="padding:0 0 12px">' +
      'Analisi automatica generata da Claude Code a fine di ogni blocco: disciplina nelle uscite easy ' +
      '(% tempo sopra AeT), separazione qualità/easy, progressione del volume, andamento FC a riposo. ' +
      'Basata sulle metriche descritte in contesto-allenamento.md — nessun documento di riferimento ' +
      'esterno collegato al momento. Non c&apos;è ancora nessun blocco completato: il primo verdetto ' +
      'reale arriva dopo la fine del blocco Restart (20 settembre 2026).' +
    '</div>' +
    cards;
}

function initTabs() {
  var btns = document.querySelectorAll(".tab-btn");
  btns.forEach(function(btn) {
    btn.addEventListener("click", function() {
      btns.forEach(function(b){ b.classList.remove("active"); });
      btn.classList.add("active");
      document.querySelectorAll(".page").forEach(function(p){ p.classList.remove("active"); });
      document.getElementById("page-" + btn.dataset.page).classList.add("active");
    });
  });
}

document.addEventListener("DOMContentLoaded", function() {
  renderOggi();
  renderForma();
  renderPiano();
  renderBlocchi();
  renderVerdict();
  renderUtmb();
  initTabs();
});

// Auto-refresh: se widget-data.json in rete è più recente di quello visto
// l'ultima volta, forza un reload bypassando la cache. Copre sia il browser
// normale sia la PWA installata in home screen, che tende a tenere la
// pagina in cache più a lungo dell'header Cache-Control del server.
(function() {
  function checkForUpdate() {
    fetch("widget-data.json?_=" + Date.now(), { cache: "no-store" })
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (!d || !d.generated_at) return;
        var seen;
        try { seen = localStorage.getItem("dashboardGeneratedAt"); } catch (e) { seen = null; }
        // Salva SEMPRE il valore visto PRIMA di eventualmente ricaricare —
        // altrimenti al reload il confronto ripete lo stesso esito e la
        // pagina resta bloccata in un loop di reload infinito (bug del
        // 15/09/2026, "la dashboard lampeggia").
        try { localStorage.setItem("dashboardGeneratedAt", d.generated_at); } catch (e) {}
        if (seen && seen !== d.generated_at) {
          // Guardia extra anti-loop: non ricaricare più di una volta ogni
          // 10 secondi, qualunque cosa succeda.
          var lastReload = 0;
          try { lastReload = parseInt(sessionStorage.getItem("dashboardLastReload") || "0", 10); } catch (e) {}
          if (Date.now() - lastReload < 10000) return;
          try { sessionStorage.setItem("dashboardLastReload", String(Date.now())); } catch (e) {}
          location.href = location.pathname + "?_=" + Date.now();
        }
      })
      .catch(function() {});
  }
  document.addEventListener("visibilitychange", function() {
    if (document.visibilityState === "visible") checkForUpdate();
  });
  window.addEventListener("focus", checkForUpdate);
  checkForUpdate();
})();
</script>
